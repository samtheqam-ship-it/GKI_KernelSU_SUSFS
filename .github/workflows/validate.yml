name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  validate:
    name: Validate workflows, shell scripts, and Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate GitHub workflows
        run: python3 .github/scripts/validate_workflows.py

      - name: Validate shell scripts
        run: python3 .github/scripts/validate_shell.py

      - name: Validate Python syntax
        run: python3 .github/scripts/validate_python.py

      - name: Validate NP03J installer syntax and flash guards
        shell: pwsh
        run: ./tests/np03j/Test-Installer.ps1

      - name: Validate NoMount installer and reboot verification
        shell: pwsh
        run: ./tests/np03j/Test-NoMountInstaller.ps1

      - name: Validate NoMount JSON arrays on PowerShell 7
        shell: pwsh
        run: ./tests/np03j/Test-NoMountJson.ps1

  windows-powershell:
    name: Validate NoMount on Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test JSON parsing on Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "Windows PowerShell 5.1 is required for this regression test"
          }
          ./tests/np03j/Test-NoMountJson.ps1
